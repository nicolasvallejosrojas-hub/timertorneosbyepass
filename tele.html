<!-- ▌BLOQUE 1 · Estilos — Pantalla completa para la tele: logo, ronda, reloj grande, tiempo extra y estado.
     -->
<!--
  tele.html — la vista del timer para teles y navegadores viejos
  -------------------------------------------------------------
  Las Smart TV traen navegadores de hace años (Tizen, webOS: Chrome 56–79) y
  timer-view.html no alcanza a arrancar ahí: usa módulos, ?. y ?? y el SDK de
  Firebase. timer-view.html los detecta y los manda acá solo.

  Esta página es JavaScript de antes (var, function, sin módulos) y CSS sin
  inset, gap ni clamp. Lee Firebase por su API REST en vivo (EventSource) o,
  si ni eso hay, preguntando cada 3 segundos. Solo lee: reloj, diseño,
  imágenes, el nombre del torneo, las mesas y el sorteo. Si algo
  cambia en el formato de salas/<sala>/timer, /pairings o /sorteo, cambiarlo
  también acá.

  Pestañas (como en timer-view.html): Timer · Mesas · Sorteo. Se cambian con
  las flechas ← → del control, o tocando/clic en la barra de abajo. ↑ ↓ pasan
  de página y OK (Enter) elige la ronda. Si nadie toca nada, las listas largas
  pasan solas de página. No tiene Ranking a propósito: necesita la cuenta de
  clasificacion.js (un módulo) y las teles no la corren; se ve en el celular.
-->
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{background:#0F2E2A;color:#F3FFFB;font-family:Inter,Arial,sans-serif;}
  #bg{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;display:none;z-index:0;}
  .caja{position:fixed;z-index:1;}
  .caja img{width:100%;height:100%;object-fit:contain;}
  #cab{position:fixed;top:0;left:0;right:0;z-index:2;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:2.2vh 2.4vw;}
  #logo{max-height:6vh;max-width:30vw;display:none;margin-right:1.4vw;}
  #marca{display:none;font-family:Newsreader,Georgia,serif;font-weight:300;font-size:4.2vh;margin-right:1.4vw;}
  #marca b{font-weight:300;color:#F45B45;}
  #titulo{font-size:2.8vh;font-weight:600;}
  #sub{font-size:2.2vh;color:#9DBDB4;margin-top:.4vh;}
  #centro{position:fixed;top:0;left:0;right:0;bottom:0;z-index:2;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;
    -webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;}
  #ronda{font-size:2.4vh;letter-spacing:.22em;text-transform:uppercase;color:#9DBDB4;margin-bottom:1.6vh;display:none;}
  #reloj{font-family:Newsreader,Georgia,serif;font-weight:300;line-height:1;letter-spacing:.01em;text-shadow:0 .6vh 3vh rgba(0,0,0,.35);}
  #reloj.pausado{opacity:.55;}
  #reloj.pulso{-webkit-animation:pulso 1s ease-in-out infinite;animation:pulso 1s ease-in-out infinite;}
  @-webkit-keyframes pulso{50%{opacity:.45;}}
  @keyframes pulso{50%{opacity:.45;}}
  #extras{margin-top:2vh;font-size:2.4vh;color:#F3FFFB;text-align:center;}
  #extras span{display:inline-block;margin:0 1vw;padding:.6vh 1.2vw;border-radius:1vh;background:rgba(0,0,0,.28);}
  #estado{position:fixed;bottom:2vh;left:0;right:0;z-index:2;text-align:center;font-size:2vh;color:#9DBDB4;}
  #aviso{position:fixed;top:0;left:0;right:0;bottom:0;z-index:5;display:none;background:#0F2E2A;text-align:center;padding-top:36vh;}
  #aviso h2{margin:0;font-size:5vh;}
  #aviso p{color:#9DBDB4;font-size:2.6vh;}

  /* Barra de pestañas: se esconde sola en el reloj para no ensuciar la pantalla. */
  #nav{position:fixed;left:0;right:0;bottom:0;z-index:4;display:-webkit-flex;display:flex;-webkit-justify-content:center;justify-content:center;
    padding:1.3vh 0;background:rgba(10,34,31,.94);-webkit-transition:opacity .4s;transition:opacity .4s;}
  #nav.oculta{opacity:0;}
  #nav span{position:relative;margin:0 .8vw;padding:1.1vh 2.6vw;border-radius:1.2vh;color:#9DBDB4;font-size:2.6vh;font-weight:600;cursor:pointer;}
  #nav span.on{background:#F45B45;color:#0F2E2A;}
  #dot{position:absolute;top:.5vh;right:.7vw;width:1.5vh;height:1.5vh;border-radius:50%;background:#FFB020;display:none;}

  /* Las tres pantallas nuevas ocupan lo que hay entre la cabecera y la barra. */
  .pag{position:fixed;left:0;right:0;top:11vh;bottom:9vh;z-index:3;display:none;overflow:hidden;background:#0F2E2A;padding:0 2.4vw;box-sizing:border-box;}
  .pag.ver{display:block;}
  .barra{height:6.4vh;padding-top:.6vh;overflow:hidden;white-space:nowrap;}
  .info{float:right;color:#9DBDB4;font-size:2.2vh;line-height:5vh;}
  .chips span{display:inline-block;margin-right:1vw;padding:.7vh 1.6vw;border-radius:1vh;background:#143833;color:#9DBDB4;font-size:2.4vh;font-weight:600;cursor:pointer;}
  .chips span.on{background:#F3FFFB;color:#0F2E2A;}
  .cols2,.cols3{height:70vh;overflow:hidden;}
  .cols2{-webkit-column-count:2;column-count:2;-webkit-column-gap:1.6vw;column-gap:1.6vw;}
  .cols3{-webkit-column-count:3;column-count:3;-webkit-column-gap:1.6vw;column-gap:1.6vw;}
  .mesa,.fila{display:block;box-sizing:border-box;overflow:hidden;background:#143833;border-radius:1.4vh;margin:0 0 1.6vh;
    -webkit-column-break-inside:avoid;break-inside:avoid;page-break-inside:avoid;}
  .mesa{height:15.6vh;padding:1.1vh 1.2vw;}
  .mn{font-size:1.8vh;letter-spacing:.16em;color:#9DBDB4;}
  .mn b{font-family:Newsreader,Georgia,serif;font-weight:300;font-size:3.4vh;color:#FFB020;letter-spacing:0;margin-left:.4vw;}
  .jug{font-size:2.5vh;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .jug small{font-size:1.9vh;color:#9DBDB4;}
  .jug b{font-size:1.7vh;letter-spacing:.1em;color:#0F2E2A;background:#FFB020;border-radius:.6vh;padding:.1vh .5vw;margin-left:.4vw;vertical-align:middle;}
  .jug.g{color:#FFB020;font-weight:600;}
  .fila{height:8vh;line-height:8vh;padding:0 1.2vw;white-space:nowrap;margin-bottom:1.2vh;}
  .fila .pt{float:right;font-size:3.2vh;font-weight:600;color:#FFB020;}
  .fila .pos{display:inline-block;min-width:4vw;font-size:3vh;font-weight:700;color:#9DBDB4;}
  .fila .pos.p1{color:#E0A800;} .fila .pos.p2{color:#8A97AD;} .fila .pos.p3{color:#C07A3A;}
  .fila .nom{display:inline-block;max-width:44%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;font-size:2.8vh;font-weight:600;}
  .fila .met{margin-left:1vw;font-size:2vh;color:#9DBDB4;}
  .catT{height:4.6vh;line-height:4.6vh;margin:0 0 .8vh;font-size:2.2vh;letter-spacing:.18em;color:#FFB020;font-weight:600;text-transform:uppercase;overflow:hidden;
    -webkit-column-break-inside:avoid;break-inside:avoid;-webkit-column-break-after:avoid;break-after:avoid;}
  .vacio{padding-top:12vh;text-align:center;color:#9DBDB4;font-size:3vh;}
  .vacio b{display:block;color:#F3FFFB;font-size:4vh;margin-bottom:1vh;}

  /* Sorteo: la rueda a la izquierda, el ganador y la lista a la derecha. */
  #pSort.ver{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;}
  #sRueda{position:relative;-webkit-flex:none;flex:none;width:68vh;height:68vh;margin:0 4vw 0 1vw;}
  #sCanvas{width:100%;height:100%;display:block;}
  #sPin{position:absolute;top:-1vh;left:50%;margin-left:-1.6vh;width:0;height:0;border-left:1.6vh solid transparent;border-right:1.6vh solid transparent;border-top:3.4vh solid #F45B45;}
  #sInfo{-webkit-flex:1;flex:1;min-width:0;}
  #sTitulo{font-size:3vh;font-weight:600;color:#9DBDB4;margin-bottom:2vh;}
  #sGanador .lbl{font-size:2.4vh;letter-spacing:.16em;color:#9DBDB4;font-weight:600;}
  #sGanador .who{font-family:Newsreader,Georgia,serif;font-weight:300;font-size:8vh;line-height:1.1;color:#FFB020;margin-top:1vh;word-wrap:break-word;}
  #sLista{margin-top:3vh;font-size:2.8vh;line-height:1.5;}
  #sLista .secLabel{font-size:2vh;letter-spacing:.16em;color:#9DBDB4;margin-bottom:.6vh;}
  #sLista div div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #sEstado{margin-top:2vh;font-size:2.2vh;color:#9DBDB4;}
</style>
</head>
<body>
<img id="bg" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">
<!-- ▌BLOQUE 2 · Marcado — Cabecera, reloj, estado y aviso de sala no disponible. -->
<div id="cab"><img id="logo" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="><span id="marca">Bye<b>Pass</b></span><div><div id="titulo"></div><div id="sub"></div></div></div>
<div id="centro"><div id="ronda"></div><div id="reloj">--:--</div><div id="extras"></div></div>
<div id="estado">Conectando…</div>
<!-- Mesas: las rondas publicadas por el organizador y la tabla de posiciones. -->
<div class="pag" id="pMesas"><div class="barra"><div class="info" id="mInfo"></div><div class="chips" id="mChips"></div></div><div id="mLista" class="cols3"></div></div>
<!-- Sorteo: la rueda gira igual que en el celular, al mismo tiempo. -->
<div class="pag" id="pSort">
  <div id="sRueda"><canvas id="sCanvas" width="440" height="440"></canvas><div id="sPin"></div></div>
  <div id="sInfo"><div id="sTitulo">Sorteo</div><div id="sVacio" class="vacio" style="display:none"><b>Todavía no hay sorteo</b>Cuando el organizador lo prepare, la rueda aparece acá sola.</div><div id="sGanador"></div><div id="sLista"></div><div id="sEstado"></div></div>
</div>
<div id="nav"><span id="tabT" class="on">Timer</span><span id="tabM">Mesas<i id="dot"></i></span><span id="tabS">Sorteo</span></div>
<div id="aviso"><h2 id="avisoT">Esta sala no está disponible</h2><p id="avisoP">Revisa el enlace, o crea tu sala en byepass.cl</p></div>

<script src="config.js?v=12"></script>
<!-- ▌BLOQUE 3 · Script ES5 para Smart TV — Sin módulos ni SDK de Firebase: lee por la API REST con
     EventSource (o cada 3 s). Calibra la hora con la cabecera Date del sitio y con el updatedAt del panel.
     -->
<script>
(function(){
  function $(id){ return document.getElementById(id); }
  function param(k){ var m = new RegExp("[?&]" + k + "=([^&#]*)").exec(location.search); return m ? decodeURIComponent(m[1]) : ""; }
  /* El mismo nombre de sala que sala.js: sin tildes, minúsculas y guiones. */
  var SALA = (param("sala") || "principal").toLowerCase().replace(/[^a-z0-9-]/g, "-").replace(/-+/g, "-").replace(/^-|-$/g, "").slice(0, 28) || "principal";
  var INVITADO = /^inv-[a-z0-9]{6}$/.test(SALA);
  var SIN_TIENDA = INVITADO || /^mi-[a-z0-9]{6}$/.test(SALA);   // timer personal: logo de ByePass, pero con fondo y cajas

  /* La base, por REST: la real o el emulador. */
  var NS = FIREBASE_CONFIG.databaseURL.replace(/^https?:\/\//, "").split(".")[0];
  function url(ruta){
    return (typeof EMULADOR !== "undefined" && EMULADOR)
      ? "http://" + EMULADOR.host + ":" + EMULADOR.db + "/" + ruta + ".json?ns=" + NS
      : FIREBASE_CONFIG.databaseURL + "/" + ruta + ".json";
  }

  /* Aplica un «put» o «patch» del stream sobre el objeto guardado. */
  function aplicar(obj, ruta, dato, esPatch){
    var partes = ruta.split("/").filter(function(p){ return p; });
    if (!partes.length){
      if (!esPatch) return dato;
      /* Un «patch» trae sus claves como RUTAS («rounds/0/matches/2/result»): es lo que manda Firebase
         cuando el panel publica solo lo que cambió (update de varias rutas). Cada una se aplica como
         un cambio en su lugar; guardarla como clave suelta dejaba la pantalla sin actualizarse. */
      obj = obj && typeof obj === "object" ? obj : {};
      for (var k in dato) if (dato.hasOwnProperty(k)) obj = aplicar(obj, "/" + k, dato[k], false);
      return obj;
    }
    obj = obj && typeof obj === "object" ? obj : {};
    var o = obj;
    for (var i = 0; i < partes.length - 1; i++){ if (!o[partes[i]] || typeof o[partes[i]] !== "object") o[partes[i]] = {}; o = o[partes[i]]; }
    var ult = partes[partes.length - 1];
    o[ult] = esPatch ? aplicar(o[ult], "/", dato, true) : dato;
    if (o[ult] === null) delete o[ult];
    return obj;
  }

  /* Escucha una ruta: en vivo con EventSource; si no hay, pregunta cada 3 s.
     alCambiar(valor, enVivo): enVivo es true solo cuando el valor es un cambio
     recién hecho por el panel. El primer evento después de CADA conexión (la
     inicial y también las reconexiones automáticas del navegador) es una
     «foto» del estado guardado, con su hora vieja: llega con enVivo = false. */
  var negada = false;
  /* Devuelve { cerrar() }: el navegador deja pocas conexiones abiertas a la vez
     por servidor (6 en HTTP/1.1), así que lo que no hace falta siempre (el
     sorteo) se escucha solo mientras se mira. */
  function escuchar(ruta, alCambiar){
    var valor = null, cerrado = false, es = null, tic = null;
    if (window.EventSource){
      var esFoto = true;                     // se vuelve a poner en true en cada onopen
      var al = function(esPatch){ return function(e){
        var m; try { m = JSON.parse(e.data); } catch(x){ return; }
        valor = aplicar(valor, m.path, m.data, esPatch);
        var enVivo = !esFoto; esFoto = false;
        alCambiar(valor, enVivo); }; };
      var abrir = function(){
        if (cerrado) return;
        es = new EventSource(url(ruta));
        es.addEventListener("put", al(false));
        es.addEventListener("patch", al(true));
        es.addEventListener("cancel", function(){ es.close(); negada = true; noDisponible(); });
        es.onopen = function(){ esFoto = true; if (!negada) $("estado").innerHTML = S ? "" : "Esperando al organizador…"; };
        es.onerror = function(){
          if (negada || cerrado) return;
          $("estado").innerHTML = S ? "Sin conexión — mostrando lo último recibido" : "Sin conexión, reintentando…";
          /* Cerrado del todo: o no hay permiso (sala que no existe o venció) o
             se cayó la red. Se pregunta cuál antes de reintentar. */
          if (es.readyState !== 2) return;
          var x = new XMLHttpRequest(); x.open("GET", url(ruta));
          x.onload = function(){ if (x.status === 401 || x.status === 403){ negada = true; noDisponible(); } else setTimeout(abrir, 3000); };
          x.onerror = function(){ setTimeout(abrir, 5000); };
          x.send();
        };
      };
      abrir();
    } else {
      var preguntar = function(){
        var x = new XMLHttpRequest();
        x.open("GET", url(ruta) + (url(ruta).indexOf("?") < 0 ? "?" : "&") + "t=" + Date.now());
        x.onload = function(){
          if (x.status === 401 || x.status === 403){ negada = true; return noDisponible(); }
          try { alCambiar(JSON.parse(x.responseText), false); } catch(e){}
          $("estado").innerHTML = S ? "" : "Esperando al organizador…";
        };
        x.onerror = function(){ $("estado").innerHTML = "Sin conexión, reintentando…"; };
        x.send();
      };
      preguntar(); tic = setInterval(preguntar, 3000);
    }
    return { cerrar: function(){ cerrado = true; if (es) es.close(); clearInterval(tic); } };
  }
  function noDisponible(){
    if (INVITADO){ $("avisoT").innerHTML = "Esta sala de invitado terminó"; $("avisoP").innerHTML = "Las salas de invitado duran 24 horas. Crea la tuya en byepass.cl"; }
    $("aviso").style.display = "block";
  }

  /* ▌BLOQUE 4 · Reloj ═════════════════════════════════════════════════════════════
     Calcula el tiempo restante contra la hora calibrada y lo dibuja. */
  /* ---------------- reloj ---------------- */
  /* El panel guarda endTime con la hora del SERVIDOR de Firebase. El reloj de
     la tele puede estar corrido unos segundos, así que hay que saber cuánto:
     `offset` = hora del servidor − hora de la tele (en ms). Esta página no usa
     el SDK, así que no tiene .info/serverTimeOffset. Lo saca de dos lados:
       1) al abrir, de la cabecera «Date» de ESTE sitio (calibrarConSitio);
       2) con cada cambio en vivo del panel, de su updatedAt, que desde el
          05-10-2026 es hora de servidor (calibrarConPanel). Es el más exacto.
     La cabecera «Date» de Firebase no sirve: no la expone por CORS y el
     navegador la entrega como null (se probó). */
  var S = null, EXTRAS = {}, offset = 0;
  var ultimoUpdated = null;       // updatedAt del último cambio ya usado para calibrar
  var conPanel = false;           // true cuando ya se calibró con un cambio del panel
  function dos(n){ return n < 10 ? "0" + n : "" + n; }
  function fmt(sec){ var a = Math.abs(sec); return (sec < 0 ? "-" : "") + dos(Math.floor(a / 60)) + ":" + dos(a % 60); }
  function ahora(){ return Date.now() + offset; }

  /* Se calibra solo con un cambio EN VIVO y nuevo. Nunca con la «foto» inicial o
     de una reconexión (esa hora es vieja y haría saltar el reloj). El panel
     nuevo publica updatedAt con hora de servidor; el viejo, con la de su PC
     (por eso el error de unos segundos del panel se pasaba a la tele). */
  function calibrarConPanel(v, enVivo){
    if (!enVivo || !v || !v.updatedAt || v.updatedAt === ultimoUpdated) return;
    ultimoUpdated = v.updatedAt;
    offset = v.updatedAt - Date.now();
    conPanel = true;
  }

  /* Al abrir: una tele que se abre con la ronda ya corriendo no recibe ningún
     cambio en vivo hasta que el panel haga algo, y mientras tanto mostraba el
     error de su propio reloj (29 s en el PC del 05-10-2026). Se pregunta la
     hora a este mismo sitio: es la misma dirección, así que el navegador sí
     deja leer la cabecera «Date». Va con HEAD porque sw.js solo atiende GET:
     así nunca contesta una copia guardada con la hora vieja. La cabecera
     trae segundos enteros (+500 ms) y tardó medio viaje en llegar. */
  function calibrarConSitio(){
    try {
      var x = new XMLHttpRequest(), t0 = Date.now();
      x.open("HEAD", location.pathname + "?hora=" + t0, true);
      x.onload = function(){
        var d = Date.parse(x.getResponseHeader("Date") || "");
        if (isNaN(d) || conPanel) return;   // si el panel ya calibró, manda el panel
        offset = d + 500 - (t0 + Date.now()) / 2;
        dibujar();
      };
      x.send();
    } catch(e){}
  }
  calibrarConSitio();

  function dibujar(){
    if (!S) return;
    var sec = (S.paused || !S.endTime) ? Math.round(S.remaining || 0) : Math.round((S.endTime - ahora()) / 1000);
    var c = $("reloj");
    c.innerHTML = fmt(sec);
    c.style.color = sec < 0 ? (S.negativeColor || "#FF7A6B") : (S.timerColor || "#F3FFFB");
    c.className = S.paused ? "pausado" : (sec <= 10 && sec >= 0 ? "pulso" : "");
    /* Igual que la vista completa: el tamaño del panel, con tope de 26 % del ancho. */
    c.style.fontSize = Math.min(S.timerSize || 150, window.innerWidth * 0.26) + "px";
    var h = [];
    for (var m in EXTRAS) if (EXTRAS.hasOwnProperty(m) && EXTRAS[m] > 0){
      var resto = sec + EXTRAS[m] * 60;
      h.push("<span>Mesa " + m + " <b>" + (sec > 0 ? "+" + EXTRAS[m] + " min" : resto > 0 ? fmt(resto) : "tiempo") + "</b></span>");
    }
    $("extras").innerHTML = h.join("");
  }
  escuchar("salas/" + SALA + "/timer/state", function(v, enVivo){
    calibrarConPanel(v, enVivo);
    S = v; if (!negada) $("estado").innerHTML = S ? "" : "Esperando al organizador…"; dibujar();
  });
  escuchar("salas/" + SALA + "/timer/extras", function(v){ EXTRAS = v || {}; dibujar(); });
  setInterval(dibujar, 250);

  /* ▌BLOQUE 5 · Diseño ════════════════════════════════════════════════════════════
     Aplica colores, fondo y logo publicados. */
  /* ---------------- diseño e imágenes ---------------- */
  var TH = null, MED = null, medVer = null;
  function pintarDiseno(){
    if (!TH) return;
    var V = TH.desktop || TH, M = (MED && MED.desktop) || {};
    var bgSrc = INVITADO ? "" : (M.bgImage || V.bgImage || "");
    var logo = SIN_TIENDA ? "" : ((MED && MED.logo) || TH.logo || "");
    if (V.bgType === "image" && bgSrc){ $("bg").src = bgSrc; $("bg").style.display = "block"; document.body.style.background = "#0F2E2A"; }
    else {
      $("bg").style.display = "none";
      var c1 = V.bgColor1 || "#0F2E2A", c2 = V.bgColor2 || "#0A221F";
      document.body.style.background = c1;
      if (V.bgType === "gradient"){
        document.body.style.background = "-webkit-linear-gradient(" + (V.bgDir === "to bottom" ? "top" : "left") + ", " + c1 + ", " + c2 + ")";
        document.body.style.background = "linear-gradient(" + (V.bgDir || "to right") + ", " + c1 + ", " + c2 + ")";
      }
    }
    if (logo){ $("logo").src = logo; $("logo").style.display = "block"; } else $("logo").style.display = "none";
    /* Las cajas de imagen, en la misma proporción que la vista completa (1180×660). */
    var viejas = document.querySelectorAll(".caja");
    for (var i = 0; i < viejas.length; i++) viejas[i].parentNode.removeChild(viejas[i]);
    var cajas = INVITADO ? [] : (V.boxes || []);
    for (var j = 0; j < cajas.length; j++){
      var b = cajas[j], src = b.src || "";
      if (!src && M.boxes) for (var k = 0; k < M.boxes.length; k++) if (M.boxes[k].id === b.id) src = M.boxes[k].src;
      if (!src) continue;
      var d = document.createElement("div"); d.className = "caja";
      if (TAB && TAB !== "timer") d.style.display = "none";   // las cajas son del reloj, no de las otras pestañas
      d.style.left = (b.x / 1180 * 100) + "vw"; d.style.top = (b.y / 660 * 100) + "vh";
      d.style.width = (b.w / 1180 * 100) + "vw"; d.style.height = (b.h / 660 * 100) + "vh";
      var im = document.createElement("img"); im.src = src; if (b.flip) im.style.transform = "scaleX(-1)";
      d.appendChild(im); document.body.appendChild(d);
    }
  }
  if (SIN_TIENDA) $("marca").style.display = "inline";
  escuchar("salas/" + SALA + "/timer/theme", function(v){ TH = v; pintarDiseno(); });
  /* Las imágenes son pesadas: se bajan una vez por versión. */
  escuchar("salas/" + SALA + "/timer/mediaVersion", function(v){
    if (v == null || v === medVer) return;
    medVer = v;
    var x = new XMLHttpRequest(); x.open("GET", url("salas/" + SALA + "/timer/media"));
    x.onload = function(){ try { MED = JSON.parse(x.responseText); pintarDiseno(); } catch(e){} };
    x.send();
  });

  /* ▌BLOQUE 6 · Nombre del torneo y ronda ═════════════════════════════════════════
     Lo saca de pairings. */
  /* ---------------- el torneo: nombre y ronda ---------------- */
  var P = null, selR = null, ultimaRonda = null, verPos = false, vistoP = 0, primeraP = true;   // lo publicado: lo usa también la pestaña Mesas
  escuchar("salas/" + SALA + "/pairings", function(D){
    P = (D && D.rounds) ? D : null;
    if (!P){
      $("titulo").innerHTML = ""; $("sub").innerHTML = ""; $("ronda").style.display = "none";
      selR = null; verPos = false; pintarMesas(); return;
    }
    var rounds = P.rounds.length != null ? P.rounds : Object.keys(P.rounds).map(function(k){ return P.rounds[k]; });
    if (selR === null || P.lastRound !== ultimaRonda) selR = P.lastRound;   // una ronda nueva se muestra sola; un resultado nuevo no te saca de la que miras
    ultimaRonda = P.lastRound;
    if (!primeraP && TAB !== "mesas" && (P.updatedAt || 0) > vistoP) $("dot").style.display = "block";
    primeraP = false;
    pintarMesas();
    var etq = "Ronda " + P.lastRound + (P.rondasTotales ? " de " + P.rondasTotales : "");
    for (var i = 0; i < rounds.length; i++) if (rounds[i] && rounds[i].number === P.lastRound && rounds[i].etiqueta) etq = rounds[i].etiqueta;
    $("titulo").textContent = P.name || "";
    $("sub").textContent = etq + (P.roundtime ? " · rondas de " + P.roundtime + " min" : "");
    $("ronda").textContent = etq + (P.phase === "results" ? " · resultados" : " · en curso");
    $("ronda").style.display = "block";
  });

  /* ▌BLOQUE 7 · Pestañas y control remoto ═════════════════════════════════════════
     Timer · Mesas · Sorteo. Flechas ← → cambian de pestaña, ↑ ↓ de página, OK elige la ronda;
     también sirve el clic (control con puntero) y el dedo. */
  /* ---------------- pestañas ---------------- */
  var TAB = "timer";
  var ORDEN = ["timer", "mesas", "sorteo"];
  var IDS = { timer: ["tabT", null], mesas: ["tabM", "pMesas"], sorteo: ["tabS", "pSort"] };
  var PG = { mesas: 0 }, ultimoToque = 0, navT = null;

  /* Firebase entrega las listas como arreglo o como objeto {0:…, 1:…}: acá, siempre arreglo. */
  function lista(x){
    if (!x) return [];
    var a = x.length != null ? x : Object.keys(x).sort(function(p, q){ return p - q; }).map(function(k){ return x[k]; });
    return a.filter(function(v){ return v != null; });
  }
  /* Tocar el DOM solo si cambió: las listas se repintan cada 10 s. */
  function poner(el, html){ if (el._h !== html){ el._h = html; el.innerHTML = html; } }
  /* El trozo de la lista que toca en esta página, y «Página x de y». */
  function paginar(k, items, por, info){
    var n = Math.max(1, Math.ceil(items.length / por));
    PG[k] = ((PG[k] % n) + n) % n;
    poner(info, n > 1 ? "Página " + (PG[k] + 1) + " de " + n : "");
    return items.slice(PG[k] * por, PG[k] * por + por).join("");
  }
  function htmlFila(pos, nombre, meta, pts){
    return '<div class="fila"><span class="pt">' + pts + '</span><span class="pos' + (pos <= 3 ? " p" + pos : "") + '">' + pos +
           '</span><span class="nom">' + esc(nombre) + '</span><span class="met">' + esc(meta) + '</span></div>';
  }
  function htmlChips(opciones, activa){
    return opciones.map(function(o){ return '<span data-o="' + esc(o[0]) + '"' + (o[0] === activa ? ' class="on"' : "") + '>' + esc(o[1]) + '</span>'; }).join("");
  }

  function mostrarNav(){
    $("nav").className = ""; clearTimeout(navT);
    if (TAB === "timer") navT = setTimeout(function(){ $("nav").className = "oculta"; }, 6000);   // el reloj se ve limpio
  }
  function mostrar(t){
    if (ORDEN.indexOf(t) < 0) t = "timer";
    TAB = t;
    for (var k in IDS) if (IDS.hasOwnProperty(k)){
      $(IDS[k][0]).className = k === t ? "on" : "";
      if (IDS[k][1]) $(IDS[k][1]).className = "pag" + (k === t ? " ver" : "");
    }
    var reloj = t === "timer", cajas = document.querySelectorAll(".caja");
    $("centro").style.display = reloj ? "" : "none";
    $("estado").style.display = reloj ? "" : "none";
    for (var i = 0; i < cajas.length; i++) cajas[i].style.display = reloj ? "" : "none";
    mostrarNav();
    escucharSorteo(t === "sorteo");
    if (t === "mesas"){ $("dot").style.display = "none"; vistoP = P ? P.updatedAt || 0 : 0; pintarMesas(); }
    else if (t === "sorteo") pintarRuleta();
  }
  function pagina(d){
    if (TAB === "mesas"){ PG.mesas += d; pintarMesas(); }
  }
  function siguienteOpcion(){
    if (TAB === "mesas"){
      var o = opcionesMesas(), ahoraO = verPos ? "pos" : String(selR);
      if (o.length) elegirMesas(o[(o.indexOf(ahoraO) + 1) % o.length]);
    }
  }

  var DEST = ["timer", "mesas", "sorteo"], BOT = ["tabT", "tabM", "tabS"];
  for (var b = 0; b < BOT.length; b++) (function(i){ $(BOT[i]).onclick = function(){ mostrar(DEST[i]); }; })(b);
  document.addEventListener("keydown", function(e){
    var c = e.keyCode, i = ORDEN.indexOf(TAB);
    ultimoToque = Date.now(); mostrarNav();
    if (c === 37 || c === 39) mostrar(ORDEN[(i + (c === 39 ? 1 : ORDEN.length - 1)) % ORDEN.length]);
    else if (c === 38 || c === 40) pagina(c === 40 ? 1 : -1);
    else if (c === 13) siguienteOpcion();
    else return;
    e.preventDefault();
  });
  document.addEventListener("mousemove", mostrarNav);
  document.addEventListener("click", function(){ ultimoToque = Date.now(); });
  /* Con nadie tocando, las listas largas pasan solas de página. */
  setInterval(function(){ if (Date.now() - ultimoToque > 20000) pagina(1); }, 10000);

  /* ▌BLOQUE 8 · Mesas ═════════════════════════════════════════════════════════════
     Las rondas publicadas (chips) y, por ronda, las mesas con su resultado; «Posiciones» si hay
     tabla. */
  /* ---------------- mesas ---------------- */
  var NOM_CAT = ["Junior", "Senior", "Masters"];                    // cat: 0, 1, 2
  function opcionesMesas(){
    var o = lista(P && P.rounds).map(function(r){ return String(r.number); });
    if (lista(P && P.standings).length) o.push("pos");
    return o;
  }
  function elegirMesas(o){
    if (o === "pos") verPos = true; else { verPos = false; selR = +o; }
    PG.mesas = 0; pintarMesas();
  }
  $("mChips").onclick = function(e){ var o = e.target.getAttribute && e.target.getAttribute("data-o"); if (o) elegirMesas(o); };

  function htmlMesa(m){
    var emp = m.result === "Empate";
    function jug(n, r, gana){
      return '<div class="jug' + (gana ? " g" : "") + '">' + esc(n) + (r ? ' <small>' + r.w + '-' + r.l + '-' + r.t + '</small>' : "") +
             (gana ? '<b>GANA</b>' : emp ? '<b>EMPATE</b>' : "") + '</div>';
    }
    return '<div class="mesa"><div class="mn">MESA<b>' + (m.p2 ? esc(m.table) : "—") + '</b></div>' +
      jug(m.p1, m.p1rec, !!m.result && m.result === "Gana " + m.p1) +
      (m.p2 ? jug(m.p2, m.p2rec, !!m.result && m.result === "Gana " + m.p2) : '<div class="jug"><small>BYE · descansa esta ronda</small></div>') + '</div>';
  }
  function pintarMesas(){
    var rs = lista(P && P.rounds), pos = lista(P && P.standings);
    if (!rs.length){
      poner($("mChips"), ""); poner($("mInfo"), ""); $("mLista").className = "cols3";
      poner($("mLista"), '<div class="vacio"><b>Aún no hay emparejamientos</b>Cuando el organizador publique la ronda, las mesas aparecen acá.</div>');
      return;
    }
    if (verPos && !pos.length) verPos = false;
    var chips = rs.map(function(r){ return [String(r.number), r.etiqueta || "R" + r.number]; });
    if (pos.length) chips.push(["pos", "Posiciones"]);
    poner($("mChips"), htmlChips(chips, verPos ? "pos" : String(selR)));
    var items;
    if (verPos){
      $("mLista").className = "cols2";
      /* Con varias categorías (la tabla ya viene ordenada: Masters, Senior, Junior), un título antes de cada una. */
      var hayCats = false, antes = null; items = [];
      for (var c = 0; c < pos.length; c++) if (pos[c].cat != null && pos[c].cat !== pos[0].cat) hayCats = true;
      pos.forEach(function(s){
        if (hayCats && s.cat !== antes){ antes = s.cat; items.push('<div class="catT">' + esc(NOM_CAT[s.cat] || "Sin categoría") + '</div>'); }
        items.push(htmlFila(s.place, s.name, s.w + "-" + s.l + "-" + s.t, s.pts));
      });
      poner($("mLista"), paginar("mesas", items, 14, $("mInfo")));
    } else {
      $("mLista").className = "cols3";
      var ronda = null;
      for (var i = 0; i < rs.length; i++) if (rs[i].number === selR) ronda = rs[i];
      items = lista(ronda && ronda.matches).map(htmlMesa);
      poner($("mLista"), paginar("mesas", items, 12, $("mInfo")));
    }
  }

  /* ▌BLOQUE 9 · Sorteo ════════════════════════════════════════════════════════════
     La ruleta: el organizador publica el giro con su hora de partida y los ángulos; cada pantalla
     anima ESE giro con la hora calibrada. Solo se escucha con la pestaña abierta. */
  /* ---------------- sorteo ---------------- */
  var SORT = null, giroId = null, animando = false, rotActual = 0, TAU = Math.PI * 2;
  var COLORES = ["#DDCC88", "#DDA288", "#DD88DD", "#AB88DD", "#88C1DD", "#88DDC1", "#88DD88", "#BADD88"];

  function dibujarRueda(cv, items, rot){
    var ctx = cv.getContext("2d"), R = cv.width / 2, N = items.length;
    ctx.clearRect(0, 0, cv.width, cv.height);
    if (!N) return;
    var seg = TAU / N, fuente = Math.max(10, Math.min(20, 460 / N));
    for (var i = 0; i < N; i++){
      var a0 = rot + i * seg;
      ctx.beginPath(); ctx.moveTo(R, R); ctx.arc(R, R, R - 4, a0, a0 + seg); ctx.closePath();
      ctx.fillStyle = COLORES[i % COLORES.length]; ctx.fill();
      ctx.strokeStyle = "rgba(14,15,24,.5)"; ctx.lineWidth = 2; ctx.stroke();
      ctx.save(); ctx.translate(R, R); ctx.rotate(a0 + seg / 2);
      ctx.textAlign = "right"; ctx.textBaseline = "middle"; ctx.fillStyle = "#10231E";
      ctx.font = "600 " + fuente + "px Inter, Arial, sans-serif";
      var nom = String(items[i]);
      ctx.fillText(nom.length > 22 ? nom.slice(0, 21) + "…" : nom, R - 16, 0);
      ctx.restore();
    }
    ctx.beginPath(); ctx.arc(R, R, R * 0.13, 0, TAU); ctx.fillStyle = "#0F2E2A"; ctx.fill();
    ctx.strokeStyle = "rgba(243,255,251,.28)"; ctx.lineWidth = 2; ctx.stroke();
  }

  function arrancarGiro(){
    var g = SORT && SORT.giro;
    if (!g || !g.id || g.id === giroId) return;
    giroId = g.id;
    /* Quien abre la tele después de que la rueda paró no ve el giro de nuevo: aparece frenada en el ganador. */
    if (ahora() > g.startAt + g.dur){ animando = false; rotActual = g.to; return; }
    animando = true;
    var raf = window.requestAnimationFrame || function(f){ return setTimeout(f, 33); };
    function fin(){ animando = false; rotActual = g.to; pintarRuleta(); }
    function paso(){
      if (!animando) return;
      var t = Math.min(1, Math.max(0, (ahora() - g.startAt) / g.dur));
      rotActual = g.from + (g.to - g.from) * (1 - Math.pow(1 - t, 4));
      pintarRuleta();
      if (t < 1) raf(paso); else fin();
    }
    raf(paso);
    /* Si la tele congela los cuadros, la rueda igual termina en el nombre correcto. */
    setTimeout(function(){ if (animando) fin(); }, Math.max(0, g.startAt - ahora()) + g.dur + 600);
  }

  function pintarRuleta(){
    if (TAB !== "sorteo") return;
    var g = SORT && SORT.giro, gs = lista(SORT && SORT.ganadores);
    var items = g && lista(g.items).length ? lista(g.items) : lista(SORT && SORT.items);
    var vacio = !items.length && !gs.length;
    $("sVacio").style.display = vacio ? "" : "none";
    $("sRueda").style.display = vacio ? "none" : "";
    if (vacio){ $("sTitulo").innerHTML = ""; $("sGanador").innerHTML = ""; $("sLista").innerHTML = ""; $("sEstado").innerHTML = ""; return; }
    $("sTitulo").textContent = (SORT && SORT.titulo) || "Sorteo";
    dibujarRueda($("sCanvas"), items, rotActual);
    $("sGanador").innerHTML = animando ? '<div class="lbl">GIRANDO…</div>'
      : g && g.ganador ? '<div class="lbl">GANADOR</div><div class="who">' + esc(g.ganador) + '</div>'
      : '<div class="lbl">LISTO PARA GIRAR</div>';
    $("sLista").innerHTML = gs.length ? '<div class="secLabel">GANADORES</div>' +
      gs.map(function(x, i){ return '<div><div>' + (i + 1) + '. ' + esc(x.nombre) + '</div></div>'; }).join("") : "";
    var quedan = lista(SORT && SORT.items).length;
    $("sEstado").textContent = quedan ? quedan + (quedan === 1 ? " participante en la rueda" : " participantes en la rueda") : "Ya salieron todos los premios.";
  }
  /* Solo se escucha con la pestaña abierta (ver escuchar). Al volver, llega la foto de lo guardado:
     arrancarGiro() la anima si el giro sigue en curso o la deja frenada si ya terminó. */
  var sorteoEsc = null;
  function escucharSorteo(sobre){
    if (sobre && !sorteoEsc) sorteoEsc = escuchar("salas/" + SALA + "/sorteo", function(v){ SORT = v; arrancarGiro(); pintarRuleta(); });
    else if (!sobre && sorteoEsc){ sorteoEsc.cerrar(); sorteoEsc = null; }
  }

  /* Se abre en la pestaña del enlace (#mesas, #sorteo) o en el reloj. */
  mostrar({ "#mesas": "mesas", "#sorteo": "sorteo" }[location.hash] || "timer");

  window.addEventListener("resize", function(){ dibujar(); pintarDiseno(); });
})();
</script>
</body>
