<!--
  Enlaces cortos: GitHub Pages muestra esta página para cualquier dirección que no sea un archivo, así que
  byepass.cl/abc234 llega acá. Se busca el código en cortos/<código> (lectura pública, solo por clave exacta) y se
  salta a la página guardada. Solo se aceptan páginas propias (inscripción, tienda, timer, rifa): jamás una dirección
  de otro sitio, aunque la base trajera una. Va sola (sin config.js ni rutas relativas) porque se abre en cualquier ruta.
-->

<link rel="stylesheet" href="/paginas/404.css?v=348d02868898">
<link rel="stylesheet" href="/sistema.css?v=348d02868898">
<script src="/tema.js?v=348d02868898"></script>
<script src="/sistema.js?v=348d02868898" defer></script>
</head>
<body data-pagina="404">
<main>
  <h1 id="t">Buscando tu enlace…</h1>
  <p id="p"></p>
  <a href="/">Ir a ByePass</a>
</main>
<script>
(function(){
  var codigo = location.pathname.replace(/^\/+|\/+$/g, "");
  var BASE = "https://timer-y-qrs-pokemon-default-rtdb.firebaseio.com";
  var PAGINA = /^(inscripcion|tienda|timer-view|rifa)\.html\?[A-Za-z0-9_=&%.~+-]{1,300}$/;   // lo mismo que exigen las reglas
  function nada(){
    document.getElementById("t").textContent = "No encontramos ese enlace";
    document.getElementById("p").textContent = "Puede que esté mal escrito o que ya no exista.";
  }
  if (!/^[a-z2-9]{5,8}$/.test(codigo)) return nada();
  fetch(BASE + "/cortos/" + codigo + ".json").then(function(r){ return r.ok ? r.json() : null; }).then(function(v){
    if (v && typeof v.ruta === "string" && PAGINA.test(v.ruta)) location.replace("/" + v.ruta); else nada();
  }).catch(nada);
})();
</script>
</body>
</html>
