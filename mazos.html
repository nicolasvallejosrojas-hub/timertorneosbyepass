<!DOCTYPE html>
<!-- ▌ÍNDICE de mazos.html (detalle y números de línea en MAPA-CODIGO.md, en la raíz del proyecto)
      1. Estilos
      2. Marcado
      3. Módulos
      4. Mis mazos
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#243B60">
<script src="tema.js?v=04fd01b03cf9"></script>
<meta name="description" content="Tus listas de mazo guardadas, para usarlas al inscribirte en un torneo.">
<title>Mis mazos — ByePass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Newsreader:opsz,wght@6..72,300&display=swap">
<link rel="stylesheet" href="tokens.css?v=04fd01b03cf9">
<link rel="stylesheet" href="estilo.css?v=04fd01b03cf9">
<link rel="stylesheet" href="armador.css?v=04fd01b03cf9">
<!-- ▌BLOQUE 1 · Estilos — La lista de mazos y el editor (el armador trae los suyos en armador.css). -->

<link rel="stylesheet" href="/paginas/mazos.css?v=04fd01b03cf9">
<link rel="stylesheet" href="/sistema.css?v=04fd01b03cf9">
<script src="/sistema.js?v=04fd01b03cf9" defer></script>
</head>
<body data-pagina="mazos">
  <!-- ▌BLOQUE 2 · Marcado — La lista de mazos guardados y el editor de uno. -->
  <header class="sup"><a class="marca bp-brand" href="index.html" aria-label="ByePass, inicio"><span class="bp-symbol" aria-hidden="true"><svg viewBox="-3.85 -0.01 41.15 41.15" aria-hidden="true"><g fill="var(--bp-logo-fondo,var(--pagina))" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="17" y="9" width="19" height="27" rx="3.6" transform="rotate(-42 18 38)"/><rect x="17" y="9" width="19" height="27" rx="3.6" transform="rotate(-28 18 38)"/><rect x="17" y="9" width="19" height="27" rx="3.6" transform="rotate(-14 18 38)"/><g><rect x="17" y="9" width="19" height="27" rx="3.6"/><path fill="none" stroke-width="1.9" stroke-linecap="round" d="M22.6 15.5v13h4.9a3.3 3.3 0 0 0 0-6.6h-4.9h4.2a3.2 3.2 0 0 0 0-6.4z"/></g></g></svg></span><span class="bp-word" aria-hidden="true">ye<span>Pass</span></span></a><a id="aMuro" href="muro.html">Mi muro</a></header>
  <main>
    <div>
      <h1>Mis mazos</h1>
      <p class="meta">Guarda hasta 10 listas y elígelas cuando te inscribas en un torneo. Solo tú las ves.</p>
    </div>

    <div class="aviso oculto" id="sinSesion" role="status"></div>

    <section class="caja oculto" id="vistaLista" aria-labelledby="tLista">
      <h2 id="tLista">Tus mazos <span id="cupo"></span></h2>
      <div id="lista"><p class="vacio">Cargando…</p></div>
      <div class="acc"><button class="btn primario" type="button" id="nuevo">Nuevo mazo</button><button class="btn" type="button" id="comparar">Comparar dos mazos</button></div>
      <p class="pista" id="listaMsg" role="status"></p>
    </section>

    <section class="oculto" id="vistaEditor" aria-labelledby="tEditor">
      <div class="caja" id="editorDatos">
        <h2 id="tEditor">Nuevo mazo</h2>
        <div class="dos">
          <label class="campo"><span>Nombre del mazo</span><input id="nombre" maxlength="60" autocomplete="off" placeholder="Ej.: Dragapult de la liga"></label>
          <label class="campo"><span>Formato</span><select id="formato"><option value="estandar">Estándar</option><option value="expandido">Expandido</option></select></label>
        </div>
      </div>
      <div class="caja armar" id="cajaLista" style="margin-top:var(--e4)"></div>
      <div class="acc" id="editorAcc" style="margin-top:var(--e4)">
        <button class="btn primario" type="button" id="guardar">Guardar el mazo</button>
        <button class="btn" type="button" id="probarEditor">Probar mazo</button>
        <button class="btn" type="button" id="compararEditor">Comparar con otro mazo</button>
        <button class="btn" type="button" id="volver">Volver a mis mazos</button>
        <p class="pista" id="editorMsg" role="status" style="flex:1 1 100%"></p>
      </div>
    </section>

    <section class="oculto" id="vistaProbar" aria-labelledby="tProbar">
      <div class="acc"><button class="btn" type="button" id="probarVolver">← Volver</button></div>
      <h2 id="tProbar" class="tProbar">Probar mazo</h2>
      <div id="probarCaja" class="probar"></div>
    </section>

    <section class="oculto" id="vistaComparar" aria-labelledby="tComparar">
      <div class="acc"><button class="btn" type="button" id="compararVolver">← Volver</button></div>
      <h2 id="tComparar" class="tProbar">Comparar dos listas</h2>
      <div class="caja elegirCmp">
        <label class="campo"><span>Lista A</span><select id="cmpA"></select></label>
        <label class="campo"><span>Lista B</span><select id="cmpB"></select></label>
      </div>
      <div id="compararCaja" class="probar"></div>
    </section>
  </main>

<script src="config.js?v=04fd01b03cf9"></script>
<!-- ▌BLOQUE 3 · Módulos — Firebase, sesion, listamazo y el armador. -->
<script type="module">
import { ref, get, set, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { db, auth, params, urlCuenta, urlMuro } from "./sesion.js?v=04fd01b03cf9";
import { leerLista, cargarEstandar, imagenCarta } from "./listamazo.js?v=04fd01b03cf9";
import { montarComparar } from "./comparar.js?v=04fd01b03cf9";
import { montarProbar } from "./probar.js?v=04fd01b03cf9";
import { armador } from "./armador.js?v=04fd01b03cf9";

const $ = id => document.getElementById(id);
/* ▌BLOQUE 4 · Mis mazos ═════════════════════════════════════════════════════════
   La lista (con la foto del primer Pokémon de cada mazo), crear, editar, borrar y guardar en
   mazos/<uid>/m1…m10. */
const MAX = 10, NOM_FMT = { estandar: "Estándar", expandido: "Expandido" };
const fecha = ms => ms ? new Date(ms).toLocaleDateString("es-CL", { day: "numeric", month: "short", year: "numeric" }) : "";
let UID = null, MAZOS = {}, EDITANDO = null, SUCIO = false;
$("aMuro").href = urlMuro();
const A = armador({ estandar: true, alCambiar: () => { SUCIO = true; } });
["nombre", "formato"].forEach(id => $(id).addEventListener("input", () => { SUCIO = true; }));
$("formato").onchange = () => { SUCIO = true; A.formato($("formato").value === "estandar"); };
addEventListener("beforeunload", e => { if (SUCIO && !$("vistaEditor").classList.contains("oculto")) e.preventDefault(); });

const ver = editor => { $("vistaLista").classList.toggle("oculto", editor); $("vistaEditor").classList.toggle("oculto", !editor); $("vistaProbar").classList.add("oculto"); $("vistaComparar").classList.add("oculto"); scrollTo(0, 0); };
const libre = () => Array.from({ length: MAX }, (_, k) => "m" + (k + 1)).find(k => !MAZOS[k]);

async function cargar(){
  try { MAZOS = (await get(ref(db, "mazos/" + UID))).val() || {}; }
  catch(e){ $("lista").innerHTML = '<p class="vacio">No se pudieron cargar tus mazos. Revisa la conexión y recarga.</p>'; return; }
  pintar();
}
async function pintar(){
  const ids = Object.keys(MAZOS).sort((a, b) => (MAZOS[b].actualizado || 0) - (MAZOS[a].actualizado || 0)), base = await cargarEstandar();
  $("cupo").textContent = "· " + ids.length + " de " + MAX;
  $("nuevo").disabled = ids.length >= MAX; $("comparar").disabled = ids.length < 2;
  $("listaMsg").textContent = ids.length >= MAX ? "Llegaste a " + MAX + " mazos: borra uno para guardar otro." : "";
  $("lista").innerHTML = ids.map(id => {
    const m = MAZOS[id], p = leerLista(m.lista).pokemon[0], tapa = p ? imagenCarta(base, p.set, p.num) : "";
    return '<div class="mazoF">' + (tapa ? '<img class="tapa" loading="lazy" alt="" src="' + esc(tapa) + '">' : '<span class="tapa" aria-hidden="true"></span>') +
      '<div class="dato"><b>' + esc(m.nombre) + "</b><small>" + esc(NOM_FMT[m.formato] + " · " + m.cartas + (m.cartas === 1 ? " carta" : " cartas") + " · editado el " + fecha(m.actualizado)) + "</small></div>" +
      '<div class="acc"><button class="btn" type="button" data-probar="' + id + '">Probar</button>' +
      '<button class="btn" type="button" data-editar="' + id + '">Editar</button>' +
      '<button class="btn" type="button" data-borrar="' + id + '">Borrar</button></div></div>';
  }).join("") || '<p class="vacio">Todavía no guardas ningún mazo. Crea uno aquí o guárdalo desde una inscripción.</p>';
}
$("lista").addEventListener("error", e => { if (e.target.classList && e.target.classList.contains("tapa")) e.target.replaceWith(Object.assign(document.createElement("span"), { className: "tapa" })); }, true);
$("lista").onclick = async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.editar) abrir(b.dataset.editar);
  if (b.dataset.probar){ const m = MAZOS[b.dataset.probar]; if (m) probar(m.nombre, m.lista, b.dataset.probar, "lista"); }
  if (b.dataset.borrar){
    const m = MAZOS[b.dataset.borrar];
    if (!m || !confirm("¿Borrar «" + m.nombre + "»? No se puede deshacer. Las inscripciones donde ya lo usaste no cambian.")) return;
    try { await remove(ref(db, "mazos/" + UID + "/" + b.dataset.borrar)); delete MAZOS[b.dataset.borrar]; pintar(); }
    catch(err){ $("listaMsg").textContent = "No se pudo borrar. Revisa la conexión."; }
  }
};

function abrir(id){
  const m = id ? MAZOS[id] : null;
  EDITANDO = id || null;
  $("tEditor").textContent = m ? "Editar «" + m.nombre + "»" : "Nuevo mazo";
  $("nombre").value = m ? m.nombre : ""; $("formato").value = m ? m.formato : "estandar";
  A.poner(m ? m.lista : ""); A.formato($("formato").value === "estandar");
  $("editorMsg").textContent = ""; SUCIO = false; $("compararEditor").disabled = !Object.keys(MAZOS).length; ver(true);
  if (!m) $("nombre").focus();
}
$("nuevo").onclick = () => abrir(null);
/* «Probar mazo»: la lista guardada o, desde el editor, la que está armada aunque no esté guardada. */
let VOLVER_A = "lista";
async function probar(nombre, lista, clave, desde){
  VOLVER_A = desde;
  $("tProbar").textContent = "Probar «" + (nombre || "mazo sin nombre") + "»";
  ["vistaLista", "vistaEditor"].forEach(v => $(v).classList.add("oculto"));
  $("vistaProbar").classList.remove("oculto"); scrollTo(0, 0);
  $("probarCaja").innerHTML = '<p class="vacio">Calculando…</p>';
  montarProbar($("probarCaja"), { lista, base: await cargarEstandar(), clave, alComparar: () => abrirComparar("probar", desde === "editor" ? "__editor" : clave) });
}
$("probarEditor").onclick = () => probar($("nombre").value.trim(), A.lista(), EDITANDO || "nuevo", "editor");
$("probarVolver").onclick = () => {
  $("vistaProbar").classList.add("oculto");
  if (VOLVER_A === "editor"){ $("vistaEditor").classList.remove("oculto"); scrollTo(0, 0); } else ver(false);
};
/* «Comparar dos listas»: de Mis mazos (dos guardados), del editor (la que armas contra una guardada) o desde Probar mazo (este contra otro). */
let CMP_DESDE = "lista";
const EDITOR = "__editor";
const datosCmp = v => v === EDITOR ? { nombre: $("nombre").value.trim() || "La lista que armas", lista: A.lista(), clave: EDITANDO || "nuevo" }
  : MAZOS[v] ? { nombre: MAZOS[v].nombre, lista: MAZOS[v].lista, clave: v } : null;
function opcionesCmp(conEditor){
  const ids = Object.keys(MAZOS).sort((x, y) => (MAZOS[y].actualizado || 0) - (MAZOS[x].actualizado || 0));
  return (conEditor ? [[EDITOR, "La lista que estás armando (sin guardar)"]] : []).concat(ids.map(id => [id, MAZOS[id].nombre + " · " + MAZOS[id].cartas + " cartas"]))
    .map(([v, t]) => '<option value="' + esc(v) + '">' + esc(t) + "</option>").join("");
}
async function ejecutarCmp(){
  const a = datosCmp($("cmpA").value), b = datosCmp($("cmpB").value);
  if (!a || !b || $("cmpA").value === $("cmpB").value){ $("compararCaja").innerHTML = '<p class="vacio">Elige dos listas distintas para compararlas.</p>'; return; }
  $("compararCaja").innerHTML = '<p class="vacio">Calculando…</p>';
  montarComparar($("compararCaja"), { a, b, base: await cargarEstandar() });
}
function abrirComparar(desde, a){
  CMP_DESDE = desde;
  const conEditor = desde === "editor" || a === EDITOR, ops = opcionesCmp(conEditor);
  $("cmpA").innerHTML = ops; $("cmpB").innerHTML = ops;
  const valores = [...$("cmpA").options].map(o => o.value);
  /* por defecto: A = la lista de la que vienes (o la más reciente) y B = la siguiente, o la del editor */
  const va = a || (desde === "editor" ? (EDITANDO && MAZOS[EDITANDO] ? EDITANDO : valores.find(v => v !== EDITOR)) : valores[0]);
  const vb = desde === "editor" ? EDITOR : valores.find(v => v !== va);
  if (va) $("cmpA").value = va; if (vb) $("cmpB").value = vb;
  ["vistaLista", "vistaEditor", "vistaProbar"].forEach(v => $(v).classList.add("oculto"));
  $("vistaComparar").classList.remove("oculto"); scrollTo(0, 0);
  ejecutarCmp();
}
$("comparar").onclick = () => abrirComparar("lista");
$("compararEditor").onclick = () => abrirComparar("editor");
$("cmpA").onchange = $("cmpB").onchange = ejecutarCmp;
$("compararVolver").onclick = () => {
  $("vistaComparar").classList.add("oculto");
  if (CMP_DESDE === "editor"){ $("vistaEditor").classList.remove("oculto"); scrollTo(0, 0); }
  else if (CMP_DESDE === "probar"){ $("vistaProbar").classList.remove("oculto"); scrollTo(0, 0); }
  else ver(false);
};
$("volver").onclick = () => { if (SUCIO && !confirm("¿Salir sin guardar los cambios?")) return; SUCIO = false; ver(false); };
$("guardar").onclick = async () => {
  const nombre = $("nombre").value.trim().replace(/\s+/g, " ").slice(0, 60), r = A.revisar(), lista = A.lista(), msg = t => { $("editorMsg").textContent = t; };
  if (!nombre) return msg("Ponle un nombre al mazo."), $("nombre").focus();
  if (!r.total) return msg("Agrega al menos una carta.");
  if (lista.length > 6000) return msg("La lista es demasiado larga: revisa que no se haya pegado dos veces.");
  const id = EDITANDO || libre();
  if (!id) return msg("Ya tienes " + MAX + " mazos: borra uno para guardar otro.");
  $("guardar").disabled = true;
  try {
    const m = { nombre, formato: $("formato").value, lista, cartas: r.total, actualizado: Date.now() };
    await set(ref(db, "mazos/" + UID + "/" + id), m);
    MAZOS[id] = m; SUCIO = false; pintar(); ver(false);
    $("listaMsg").textContent = "Guardado «" + nombre + "»" + (r.total !== 60 ? " (tiene " + r.total + " cartas: para inscribirte necesitas 60)." : ".");
  } catch(e){ msg("No se pudo guardar. Revisa la conexión y vuelve a intentarlo."); }
  $("guardar").disabled = false;
};

onAuthStateChanged(auth, u => {
  UID = u ? u.uid : null;
  if (!u || u.isAnonymous){
    $("sinSesion").innerHTML = 'Entra con tu cuenta de ByePass para guardar tus mazos. <a href="' +
      esc(urlCuenta("ingresar").replace("#", (params() ? "&" : "?") + "volver=" + encodeURIComponent("mazos.html" + params()) + "#")) + '">Entrar</a>';
    $("sinSesion").classList.remove("oculto"); $("vistaLista").classList.add("oculto"); $("vistaEditor").classList.add("oculto"); $("vistaProbar").classList.add("oculto"); $("vistaComparar").classList.add("oculto");
    return;
  }
  $("sinSesion").classList.add("oculto"); ver(false); cargar();
});
</script>
</body>
</html>
